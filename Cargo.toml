[package]
name = "rust-1M-rps"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version="0.8.9", features = ["default", "http2", "macros", "multipart", "ws"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "time", "uuid", "json", "macros", "migrate"] }
dotenv = "0.15.0"
log = "0.4.33"
async-trait = "0.1.92"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.18"
time = "0.3"
